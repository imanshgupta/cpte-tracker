<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ansh — Java Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e12;--surface:#18181e;--surface2:#1f1f27;--line:#2a2a35;--line2:#222230;
  --text:#e6e4e1;--muted:#9a9896;--dim:#4e4d52;
  --accent:#d4a373;
  --java:#e76f51;--spring:#6a994e;--dsa:#457b9d;--sql:#a87fb8;--sd:#e9c46a;--cloud:#2a9d8f;--mock:#e63946;--rev:#888;
  --done-bg:rgba(105,219,124,0.08);--done-border:rgba(105,219,124,0.35);
  --prog-bg:rgba(105,219,124,0.15);--prog-border:rgba(105,219,124,0.5);
}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(69,123,157,0.05) 0%,transparent 45%),radial-gradient(circle at 85% 75%,rgba(106,153,78,0.04) 0%,transparent 45%);pointer-events:none;z-index:0}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 0;position:relative;z-index:1}

/* header */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.back-link{font-size:11px;color:var(--dim);text-decoration:none;letter-spacing:0.04em;transition:color 0.15s}
.back-link:hover{color:var(--muted)}
.header-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
.header-sub{font-size:11px;color:var(--dim);margin-top:1px;font-family:'JetBrains Mono',monospace}
.day-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* tabs */
.tab-wrap{overflow-x:auto;margin-bottom:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab-wrap::-webkit-scrollbar{display:none}
.tab-bar{display:flex;gap:5px;width:max-content}
.tb{font-size:12px;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--dim);white-space:nowrap;font-weight:500;font-family:'JetBrains Mono',monospace;transition:all 0.15s}
.tb:hover{color:var(--muted);border-color:var(--line2)}
.tb.active{background:var(--accent);border-color:var(--accent);color:#1a0f00;font-weight:700}

/* panels */
.panel{display:none}.panel.active{display:block}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-family:'JetBrains Mono',monospace}

/* progress bar */
.prog-bg{background:var(--surface2);border-radius:3px;height:5px;overflow:hidden;margin-top:4px}
.prog-fill{height:5px;border-radius:3px;transition:width 0.4s ease}

/* stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 10px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;line-height:1.1}
.stat-sub{font-size:10px;color:var(--dim);margin-top:2px}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}

/* today slot blocks */
.slot-block{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:12px;margin-bottom:8px}
.slot-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slot-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:0.05em;white-space:nowrap}
.slot-badge.dsa{background:rgba(69,123,157,0.2);color:#6da3c0;border:1px solid rgba(69,123,157,0.3)}
.slot-badge.java{background:rgba(231,111,81,0.18);color:#e8886e;border:1px solid rgba(231,111,81,0.25)}
.slot-badge.spring{background:rgba(106,153,78,0.18);color:#7ab85e;border:1px solid rgba(106,153,78,0.25)}
.slot-badge.rev{background:rgba(136,136,136,0.15);color:#aaa;border:1px solid rgba(136,136,136,0.2)}
.slot-badge.sql{background:rgba(168,127,184,0.18);color:#b893cc;border:1px solid rgba(168,127,184,0.25)}
.slot-badge.sd{background:rgba(233,196,106,0.18);color:#c9a835;border:1px solid rgba(233,196,106,0.25)}
.slot-badge.cloud{background:rgba(42,157,143,0.18);color:#3db8a8;border:1px solid rgba(42,157,143,0.25)}
.slot-badge.mock{background:rgba(230,57,70,0.15);color:#e85a68;border:1px solid rgba(230,57,70,0.2)}
.slot-badge.hands-on{background:rgba(212,163,115,0.15);color:#c4956a;border:1px solid rgba(212,163,115,0.2)}
.slot-badge.behavioral{background:rgba(168,127,184,0.15);color:#b893cc;border:1px solid rgba(168,127,184,0.2)}
.slot-badge.revision{background:rgba(136,136,136,0.1);color:#888;border:1px solid rgba(136,136,136,0.15)}
.slot-title{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0.05em}
.slot-content{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:10px}

/* slot done checkbox */
.chk-row{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 8px;border-radius:6px;border:1px solid var(--line2);transition:all 0.15s;margin-top:4px}
.chk-row:hover{border-color:var(--done-border);background:var(--done-bg)}
.chk-row.done{border-color:var(--done-border);background:var(--done-bg)}
.chk-box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:transparent;transition:all 0.15s;flex-shrink:0}
.chk-row.done .chk-box{background:rgba(105,219,124,0.25);border-color:rgba(105,219,124,0.6);color:#69db7c}
.chk-lbl{font-size:12px;color:var(--dim);transition:color 0.15s}
.chk-row.done .chk-lbl{color:rgba(105,219,124,0.8)}

/* week strip */
.week-strip{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-top:12px}
.week-strip::-webkit-scrollbar{display:none}
.wday{flex-shrink:0;width:58px;background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:8px 6px;text-align:center;cursor:pointer;transition:all 0.15s}
.wday:hover{border-color:var(--dim)}
.wday.today{border-color:var(--accent);background:rgba(212,163,115,0.1)}
.wday.done-day{border-color:var(--done-border);background:var(--done-bg)}
.wday-name{font-size:9px;font-weight:700;letter-spacing:0.1em;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.wday.today .wday-name{color:var(--accent)}
.wday-date{font-size:14px;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.wday.today .wday-date{color:var(--accent)}
.wday-dots{display:flex;gap:2px;justify-content:center}
.wdot{width:5px;height:5px;border-radius:50%;background:var(--surface2)}
.wdot.done{background:rgba(105,219,124,0.6)}
.wdot.partial{background:rgba(212,163,115,0.6)}

/* today header banner */
.today-banner{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.today-banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.tb-phase{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:0.1em;margin-bottom:4px}
.tb-date{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
.tb-week{font-size:12px;color:var(--muted);margin-top:2px}

/* weeks view */
.week-selector{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.week-selector label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:0.08em}
.week-selector select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;cursor:pointer;flex:1;max-width:420px}
.week-selector select:focus{border-color:var(--accent)}
.week-header{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;border-left:3px solid var(--accent)}
.wh-phase{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:0.1em;margin-bottom:3px}
.wh-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.wh-range{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.week-day-row{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;margin-bottom:6px;overflow:hidden}
.wdr-header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.wdr-day{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);min-width:30px}
.wdr-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.wdr-today-badge{font-size:10px;background:rgba(212,163,115,0.2);color:var(--accent);padding:1px 6px;border-radius:10px;font-family:'JetBrains Mono',monospace}
.wdr-slots{padding:10px 12px;display:grid;gap:6px}
.wdr-slot{display:flex;gap:8px;align-items:flex-start}
.wdr-slot-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--dim);min-width:14px;margin-top:1px}
.wdr-slot-text{font-size:12px;color:var(--muted);line-height:1.4;flex:1}

/* GFG tracker */
.module-section{margin-bottom:14px}
.module-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:none}
.module-name{font-weight:700;font-size:14px;color:var(--text)}
.module-pct{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent)}
.module-prog{background:var(--surface2);height:3px;margin:0 0 0}
.module-prog .fill{height:3px;background:var(--accent);transition:width 0.4s}
.topic-row{background:var(--surface2);border:1px solid var(--line2);border-top:none;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:all 0.2s}
.topic-row:last-child{border-radius:0 0 8px 8px}
.topic-row.t-done{background:var(--done-bg);border-color:var(--done-border)}
.topic-row.t-done .topic-name{color:rgba(105,219,124,0.75);text-decoration:line-through}
.topic-row.t-prog{border-left:2px solid var(--accent)}
.topic-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:22px;flex-shrink:0}
.topic-info{flex:1;min-width:0}
.topic-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-counts{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.topic-inputs{display:flex;gap:6px;align-items:center;flex-shrink:0}
.inp-grp{display:flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.inp-grp input{width:38px;padding:4px 5px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;text-align:center;-moz-appearance:textfield;outline:none}
.inp-grp input::-webkit-outer-spin-button,.inp-grp input::-webkit-inner-spin-button{-webkit-appearance:none}
.inp-grp input:focus{border-color:var(--accent)}
.topic-pct{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--dim);min-width:32px;text-align:right;flex-shrink:0}
.topic-row.t-done .topic-pct{color:rgba(105,219,124,0.8)}
.topic-mini-bar{width:40px;height:3px;background:var(--line2);border-radius:2px;flex-shrink:0;overflow:hidden}
.topic-mini-bar .fill{height:3px;background:var(--accent);border-radius:2px;transition:width 0.3s}
.topic-row.t-done .topic-mini-bar .fill{background:rgba(105,219,124,0.7)}

/* tracks */
.track-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.track-card{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:14px;border-left:3px solid}
.tc-track{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.1em;margin-bottom:6px}
.tc-hours{font-size:24px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;line-height:1}
.tc-pct{font-size:12px;color:var(--dim);margin-left:4px;font-weight:400}
.tc-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.tc-when{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-top:6px}

/* budget */
.budget-bar{background:var(--surface2);border-radius:4px;height:20px;overflow:hidden;display:flex;margin-bottom:14px;border:1px solid var(--line2)}
.budget-seg{height:20px;transition:width 0.4s}
.budget-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px}
.bcard{background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.bcard-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bcard-info{flex:1}
.bcard-name{font-size:12px;font-weight:600;color:var(--text)}
.bcard-h{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}

/* rules */
.rule-block{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:14px;margin-bottom:8px}
.rule-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.08em;margin-bottom:8px}
.rule-item{display:flex;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted);line-height:1.5}
.rule-item:last-child{margin-bottom:0}
.rule-bullet{color:var(--dim);flex-shrink:0;font-family:'JetBrains Mono',monospace}

/* before/after plan */
.pre-plan{text-align:center;padding:40px 20px}
.pre-plan-big{font-size:40px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;margin-bottom:8px}
.pre-plan-lbl{font-size:13px;color:var(--dim);margin-bottom:20px}
.pre-plan-date{font-size:15px;font-weight:600;color:var(--accent)}

/* misc */
.reset-btn{background:transparent;border:1px solid var(--mock);color:var(--mock);padding:8px 16px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;cursor:pointer;margin-top:14px;transition:all 0.15s}
.reset-btn:hover{background:rgba(230,57,70,0.1)}
.separator{height:1px;background:var(--line2);margin:10px 0}

@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .track-grid{grid-template-columns:1fr}
  .budget-grid{grid-template-columns:1fr}
  .topic-row{flex-wrap:wrap}
  .topic-inputs{width:100%;justify-content:flex-start;margin-top:4px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="app-header">
  <a href="index.html" class="back-link">← Trackers</a>
  <div>
    <div class="header-title">Ansh — Java Interview Prep</div>
    <div class="header-sub">193 days · 1,158h · Walmart / PayPal / Swiggy</div>
  </div>
  <div class="day-pill" id="day-pill">Loading...</div>
</div>

<div class="tab-wrap">
  <div class="tab-bar">
    <button class="tb active" onclick="showTab('today')">Today</button>
    <button class="tb" onclick="showTab('weeks')">Weeks</button>
    <button class="tb" onclick="showTab('gfg')">GFG Tracker</button>
    <button class="tb" onclick="showTab('tracks')">Tracks</button>
    <button class="tb" onclick="showTab('budget')">Budget</button>
    <button class="tb" onclick="showTab('rules')">Daily Rules</button>
  </div>
</div>

<div id="panel-today" class="panel active"></div>
<div id="panel-weeks" class="panel"></div>
<div id="panel-gfg" class="panel"></div>
<div id="panel-tracks" class="panel"></div>
<div id="panel-budget" class="panel"></div>
<div id="panel-rules" class="panel"></div>

</div><!-- .wrap -->
<script src="ansh.js"></script>
</body>
</html>

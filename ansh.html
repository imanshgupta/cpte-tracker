<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBOv9AkoHLMUUJ3AcbKFMOHAY4Jt_VLNiQ",
    authDomain: "trackerapp-a59a4.firebaseapp.com",
    projectId: "trackerapp-a59a4",
    storageBucket: "trackerapp-a59a4.firebasestorage.app",
    messagingSenderId: "943420755689",
    appId: "1:943420755689:web:08e8b8b773c0da20d7aa78"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();
  window.firebaseAuth = auth;
  window.firebaseProvider = provider;
  window.firebaseDB = db;
  window.signInWithPopup = signInWithPopup;
  window.signOut = signOut;
  window.firestoreDoc = doc;
  window.firestoreSetDoc = setDoc;
  window.firestoreGetDoc = getDoc;
  window.firestoreOnSnapshot = onSnapshot;
  onAuthStateChanged(auth, user => {
    window.dispatchEvent(new CustomEvent('ansh-auth', { detail: { user } }));
  });
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e12;--surface:#18181e;--surface2:#1f1f27;--line:#2a2a35;--line2:#222230;
  --text:#e6e4e1;--muted:#9a9896;--dim:#4e4d52;
  --accent:#d4a373;
  --java:#e76f51;--spring:#6a994e;--dsa:#457b9d;--sql:#a87fb8;--sd:#e9c46a;--cloud:#2a9d8f;--mock:#e63946;--rev:#888;
  --prog-c:#e76f51;--done-c:rgba(105,219,124,0.08);--done-b:rgba(105,219,124,0.35);
}
html,body{min-height:100vh}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(69,123,157,0.05) 0%,transparent 45%),radial-gradient(circle at 85% 75%,rgba(106,153,78,0.04) 0%,transparent 45%);pointer-events:none;z-index:0}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 0;position:relative;z-index:1}

/* header */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.header-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
.header-sub{font-size:11px;color:var(--dim);margin-top:1px;font-family:'JetBrains Mono',monospace}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.day-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.auth-btn{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface2);color:var(--dim);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.auth-btn:hover{border-color:var(--accent);color:var(--accent)}
.auth-btn.signed-in{border-color:rgba(105,219,124,0.4);color:rgba(105,219,124,0.8)}

/* tabs */
.tab-wrap{overflow-x:auto;margin-bottom:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab-wrap::-webkit-scrollbar{display:none}
.tab-bar{display:flex;gap:5px;width:max-content}
.tb{font-size:12px;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--dim);white-space:nowrap;font-weight:500;font-family:'JetBrains Mono',monospace;transition:all 0.15s}
.tb:hover{color:var(--muted)}
.tb.active{background:var(--accent);border-color:var(--accent);color:#1a0f00;font-weight:700}

/* panels */
.panel{display:none}.panel.active{display:block}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.lbl{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;font-family:'JetBrains Mono',monospace}

/* progress bar */
.prog-bg{background:var(--surface2);border-radius:3px;height:5px;overflow:hidden;margin-top:4px}
.prog-fill{height:5px;border-radius:3px;transition:width 0.4s ease}

/* stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 10px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;line-height:1.1}
.stat-sub{font-size:10px;color:var(--dim);margin-top:2px}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}

/* today slot blocks */
.slot-block{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:12px;margin-bottom:8px}
.slot-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slot-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;letter-spacing:0.05em;white-space:nowrap}
.slot-badge.dsa{background:rgba(69,123,157,0.2);color:#6da3c0;border:1px solid rgba(69,123,157,0.3)}
.slot-badge.java{background:rgba(231,111,81,0.18);color:#e8886e;border:1px solid rgba(231,111,81,0.25)}
.slot-badge.spring{background:rgba(106,153,78,0.18);color:#7ab85e;border:1px solid rgba(106,153,78,0.25)}
.slot-badge.rev,.slot-badge.revision{background:rgba(136,136,136,0.1);color:#aaa;border:1px solid rgba(136,136,136,0.15)}
.slot-badge.sql{background:rgba(168,127,184,0.18);color:#b893cc;border:1px solid rgba(168,127,184,0.25)}
.slot-badge.sd{background:rgba(233,196,106,0.18);color:#c9a835;border:1px solid rgba(233,196,106,0.25)}
.slot-badge.cloud{background:rgba(42,157,143,0.18);color:#3db8a8;border:1px solid rgba(42,157,143,0.25)}
.slot-badge.mock{background:rgba(230,57,70,0.15);color:#e85a68;border:1px solid rgba(230,57,70,0.2)}
.slot-badge.hands-on{background:rgba(212,163,115,0.15);color:#c4956a;border:1px solid rgba(212,163,115,0.2)}
.slot-badge.behavioral{background:rgba(168,127,184,0.15);color:#b893cc;border:1px solid rgba(168,127,184,0.2)}
.slot-content{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:10px}
.u-group{font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px}
.u-group:first-child{margin-top:0}
.u-item{font-size:13px;color:var(--text);line-height:1.5;padding:2px 0 2px 12px;position:relative}
.u-item::before{content:'';position:absolute;left:2px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--line)}
.u-meta{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--dim);margin-top:8px;letter-spacing:0.04em}
.pace-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11px}
.pace-bar{flex:1;height:4px;border-radius:3px;background:var(--surface2);overflow:hidden;min-width:40px}
.pace-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.25s}
.pace-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);min-width:56px;text-align:right}
.pace-rate{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:112px;text-align:right}
.pace-flag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:64px;text-align:right}
.pace-flag.behind{color:#e63946}
.pace-flag.ahead{color:#6a994e}
.pace-fill.behind{background:#e63946}
.pace-fill.ahead{background:#6a994e}
.wdr-tick{color:#6a994e;font-size:11px;margin-left:4px}
.chk-row{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 8px;border-radius:6px;border:1px solid var(--line2);transition:all 0.15s;margin-top:4px}
.chk-row:hover{border-color:var(--done-b);background:var(--done-c)}
.chk-row.done{border-color:var(--done-b);background:var(--done-c)}
.chk-box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:transparent;transition:all 0.15s;flex-shrink:0}
.chk-row.done .chk-box{background:rgba(105,219,124,0.25);border-color:rgba(105,219,124,0.6);color:#69db7c}
.chk-lbl{font-size:12px;color:var(--dim);transition:color 0.15s}
.chk-row.done .chk-lbl{color:rgba(105,219,124,0.8)}

/* week strip */
.week-strip{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-top:12px}
.week-strip::-webkit-scrollbar{display:none}
.wday{flex-shrink:0;width:58px;background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:8px 6px;text-align:center;transition:all 0.15s}
.wday.today{border-color:var(--accent);background:rgba(212,163,115,0.1)}
.wday.done-day{border-color:var(--done-b);background:var(--done-c)}
.wday-name{font-size:9px;font-weight:700;letter-spacing:0.1em;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.wday.today .wday-name{color:var(--accent)}
.wday-date{font-size:14px;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
.wday.today .wday-date{color:var(--accent)}
.wday-dots{display:flex;gap:2px;justify-content:center}
.wdot{width:5px;height:5px;border-radius:50%;background:var(--surface2)}
.wdot.done{background:rgba(105,219,124,0.6)}

/* today banner */
.today-banner{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.today-banner::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.tb-phase{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:0.1em;margin-bottom:4px}
.tb-date{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.01em}
.tb-week{font-size:12px;color:var(--muted);margin-top:2px}

/* weeks view */
.week-selector{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.week-selector label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:0.08em}
.week-selector select{background:var(--surface);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;cursor:pointer;flex:1;max-width:420px}
.week-selector select:focus{border-color:var(--accent)}
.week-header{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;border-left:3px solid var(--accent)}
.wh-phase{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;letter-spacing:0.1em;margin-bottom:3px}
.wh-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.wh-range{font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.week-day-row{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;margin-bottom:6px;overflow:hidden}
.wdr-header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.wdr-day{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);min-width:30px}
.wdr-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.wdr-today-badge{font-size:10px;background:rgba(212,163,115,0.2);color:var(--accent);padding:1px 6px;border-radius:10px;font-family:'JetBrains Mono',monospace}
.wdr-slots{padding:10px 12px;display:grid;gap:6px}
.wdr-slot{display:flex;gap:8px;align-items:flex-start}
.wdr-slot-text{font-size:12px;color:var(--muted);line-height:1.4;flex:1;margin-left:6px}

/* GFG tracker */
.module-section{margin-bottom:14px}
.module-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:none}
.module-name{font-weight:700;font-size:14px;color:var(--text)}
.module-pct{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent)}
.module-prog{height:3px;margin:0}
.module-prog .fill{height:3px;transition:width 0.4s}
.topic-row{background:var(--surface2);border:1px solid var(--line2);border-top:none;padding:10px 14px;display:flex;align-items:center;gap:10px;transition:all 0.2s}
.topic-row:last-child{border-radius:0 0 8px 8px}
.topic-row.t-done{background:var(--done-c);border-color:var(--done-b)}
.topic-row.t-done .topic-name{color:rgba(105,219,124,0.75);text-decoration:line-through}
.topic-row.t-prog{border-left:2px solid var(--accent)}
.topic-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:22px;flex-shrink:0;display:flex;align-items:center;gap:4px}
.topic-info{flex:1;min-width:0}
.topic-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-counts{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.topic-pct{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--dim);min-width:32px;text-align:right;flex-shrink:0}
.topic-row.t-done .topic-pct{color:rgba(105,219,124,0.8)}
.topic-mini-bar{width:40px;height:3px;background:var(--line2);border-radius:2px;flex-shrink:0;overflow:hidden}
.topic-mini-bar .fill{height:3px;background:var(--accent);border-radius:2px;transition:width 0.3s}
.topic-row.t-done .topic-mini-bar .fill{background:rgba(105,219,124,0.7)}
.gfg-chevron{display:inline-block;font-size:9px;color:var(--dim);transition:transform 0.15s;transform:rotate(0deg)}
.gfg-chevron.open{transform:rotate(90deg)}
.module-name .gfg-chevron{margin-right:6px;font-size:11px}
.video-list{background:var(--bg);border:1px solid var(--line2);border-top:none}
.video-row{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 34px;cursor:pointer;transition:background 0.15s;border-bottom:1px solid var(--line2)}
.video-row:last-child{border-bottom:none}
.video-row:hover{background:var(--surface2)}
.video-box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:transparent;flex-shrink:0;transition:all 0.15s}
.video-row.done .video-box{background:rgba(105,219,124,0.25);border-color:rgba(105,219,124,0.6);color:#69db7c}
.video-name{flex:1;min-width:0;font-size:12.5px;color:var(--text)}
.video-row.done .video-name{color:rgba(105,219,124,0.75);text-decoration:line-through}
.video-dur{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);flex-shrink:0}

/* ── TRACK TOPIC ROWS (Java/Spring/SQL/SD/Cloud) ── */
.track-section{margin-bottom:14px}
.track-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:none;cursor:pointer}
.track-section-hdr:hover{background:var(--surface2)}
.track-section-title{font-weight:700;font-size:13px;color:var(--text)}
.track-section-meta{display:flex;align-items:center;gap:10px}
.track-pct-lbl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.track-section-prog{height:3px;margin:0}
.track-section-prog .fill{height:3px;transition:width 0.4s}

.tr-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line2);border-top:none;background:var(--surface2);transition:all 0.18s}
.tr-row:last-child{border-radius:0 0 8px 8px}
.tr-row.s-prog{background:rgba(231,111,81,0.08);border-color:rgba(231,111,81,0.35)}
.tr-row.s-prog .tr-name{color:rgba(231,111,81,0.9)}
.tr-row.s-done{background:var(--done-c);border-color:var(--done-b)}
.tr-row.s-done .tr-name{color:rgba(105,219,124,0.75);text-decoration:line-through}

.tr-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:20px;flex-shrink:0}
.tr-info{flex:1;min-width:0}
.tr-name{font-size:13px;font-weight:500;color:var(--text);line-height:1.35}
.topic-link{color:inherit;text-decoration:underline;text-decoration-color:rgba(212,163,115,0.55);text-underline-offset:2px}
.topic-link:hover{text-decoration-color:var(--accent);color:var(--accent)}
.tr-meta-row{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.tr-hours{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.tr-pri{font-size:9px;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:0.04em}
.pri-vh{background:rgba(230,57,70,0.15);color:#e85a68}
.pri-h{background:rgba(233,196,106,0.15);color:#c9a835}
.pri-m{background:rgba(136,136,136,0.12);color:#888}
.pri-l{background:rgba(69,123,157,0.12);color:#6da3c0}

.tr-btns{display:flex;gap:4px;flex-shrink:0}
.trb{font-size:10px;padding:4px 8px;border-radius:4px;cursor:pointer;font-weight:700;border:1.5px solid;background:transparent;transition:all 0.15s;white-space:nowrap;font-family:'JetBrains Mono',monospace;line-height:1}
/* Progress button */
.trb-p{border-color:rgba(231,111,81,0.35);color:rgba(231,111,81,0.6)}
.trb-p:hover{border-color:rgba(231,111,81,0.7);color:rgba(231,111,81,0.9)}
.tr-row.s-prog .trb-p{background:rgba(231,111,81,0.18);color:#e87a5a;border-color:#e76f51}
/* Done button */
.trb-d{border-color:rgba(105,219,124,0.3);color:rgba(105,219,124,0.55)}
.trb-d:hover{border-color:rgba(105,219,124,0.6);color:rgba(105,219,124,0.85)}
.tr-row.s-done .trb-d{background:rgba(105,219,124,0.15);color:#69db7c;border-color:#69db7c}

/* Track overview bar */
.track-overview{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.to-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.to-name{font-size:13px;font-weight:600;color:var(--text);min-width:80px}
.to-bar{flex:1;background:var(--surface2);border-radius:3px;height:6px;overflow:hidden}
.to-bar-fill{height:6px;border-radius:3px;transition:width 0.4s}
.to-pct{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);min-width:36px;text-align:right}
.to-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);min-width:52px;text-align:right}

/* Budget */
.budget-bar{background:var(--surface2);border-radius:4px;height:20px;overflow:hidden;display:flex;margin-bottom:14px;border:1px solid var(--line2)}
.budget-seg{height:20px}
.budget-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px}
.bcard{background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.bcard-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bcard-info{flex:1}
.bcard-name{font-size:12px;font-weight:600;color:var(--text)}
.bcard-h{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}

/* Rules */
.rule-block{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:14px;margin-bottom:8px}
.rule-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.08em;margin-bottom:8px}
.rule-item{display:flex;gap:8px;margin-bottom:6px;font-size:13px;color:var(--muted);line-height:1.5}
.rule-item:last-child{margin-bottom:0}
.rule-bullet{color:var(--dim);flex-shrink:0;font-family:'JetBrains Mono',monospace}

/* before/after plan */
.pre-plan{text-align:center;padding:40px 20px}
.pre-plan-big{font-size:40px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;margin-bottom:8px}
.pre-plan-lbl{font-size:13px;color:var(--dim);margin-bottom:20px}
.pre-plan-date{font-size:15px;font-weight:600;color:var(--accent)}

/* misc */
.reset-btn{background:transparent;border:1px solid var(--mock);color:var(--mock);padding:8px 16px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;cursor:pointer;margin-top:14px;transition:all 0.15s}
.reset-btn:hover{background:rgba(230,57,70,0.1)}

@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .budget-grid{grid-template-columns:1fr}
  .topic-row{flex-wrap:wrap}
  .tr-row{flex-wrap:wrap}
  .tr-btns{width:100%;margin-top:4px}
}

/* plan ledger */
.late{color:#e63946}.early{color:#6a994e}
/* always-on program finish flash */
.finish-flash:empty{display:none}
.finish-flash{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:8px;text-align:center;margin:-4px 0 12px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.finish-flash .ff-k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--dim);text-transform:uppercase}
.finish-flash .ff-date{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;animation:finishPulse 1.7s ease-in-out infinite}
.finish-flash .ff-late{color:#e63946}.finish-flash .ff-early{color:#6a994e}.finish-flash .ff-ontrack{color:var(--accent)}
.finish-flash .ff-done{color:#6a994e;font-weight:700;font-family:'JetBrains Mono',monospace;animation:finishPulse 1.7s ease-in-out infinite}
@keyframes finishPulse{0%,100%{opacity:1}50%{opacity:0.45}}
.behind-card{border-left:3px solid #e63946}.behind-card.ok{border-left-color:#6a994e}
.late-chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:10px;margin:0 6px 4px 0;background:rgba(230,57,70,0.12);color:#e85a68;border:1px solid rgba(230,57,70,0.25)}
.pg-status{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--muted)}
.pg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px}
.pg-k{font-size:9.5px;font-family:'JetBrains Mono',monospace;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.pg-v{font-size:13px;font-weight:600;color:var(--text)}
.pg-line{display:flex;gap:10px;align-items:baseline;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--line2)}
.pg-line:last-child{border-bottom:none}
.pg-line>span:first-child{flex:1;min-width:0}
.pg-line .late,.pg-line .early{font-family:'JetBrains Mono',monospace;font-size:11px;white-space:nowrap}
.pg-dim{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--dim);white-space:nowrap}
@media(max-width:600px){.pg-grid{grid-template-columns:repeat(2,1fr)}.pg-line{flex-wrap:wrap}}

/* Auth gate */
#loading-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.loading-dots{display:flex;gap:7px}
.loading-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:loading-pulse 1.1s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:0.15s}
.loading-dot:nth-child(3){animation-delay:0.3s}
@keyframes loading-pulse{0%,80%,100%{opacity:0.25;transform:scale(0.8)}40%{opacity:1;transform:scale(1)}}
#signin-overlay{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#signin-overlay.visible{display:flex}
#signin-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;max-width:340px;width:100%;text-align:center}
#signin-card .sc-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
#signin-card .sc-sub{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:24px}
#signin-google-btn{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);width:100%;justify-content:center;transition:all 0.15s}
#signin-google-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div id="loading-screen">
  <div style="font-size:13px;color:var(--dim);font-family:'JetBrains Mono',monospace">Checking sign-in...</div>
  <div class="loading-dots"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
</div>
<div id="signin-overlay">
  <div id="signin-card">
    <div class="sc-title">Ansh — Java Interview Prep</div>
    <div class="sc-sub">Sign in with Google to load and sync your progress. Your plan lives in Firestore under your account, so it stays identical across every device you sign into.</div>
    <button id="signin-google-btn" onclick="handleAuth()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>
  </div>
</div>
<div id="app" class="wrap" style="display:none">

<div class="app-header">
  <div>
    <div class="header-title">Ansh — Java Interview Prep</div>
    <div class="header-sub">193 days · 1,158h · Walmart / PayPal / Swiggy</div>
  </div>
  <div class="header-right">
    <button class="auth-btn" id="auth-btn" onclick="handleAuth()">Sign In</button>
    <div class="day-pill" id="day-pill">Loading...</div>
  </div>
</div>

<div class="finish-flash" id="finish-flash"></div>

<div class="tab-wrap">
  <div class="tab-bar">
    <button class="tb active" onclick="showTab('today',this)">Today</button>
    <button class="tb" onclick="showTab('progress',this)">Progress</button>
    <button class="tb" onclick="showTab('weeks',this)">Weeks</button>
    <button class="tb" onclick="showTab('gfg',this)">GFG Tracker</button>
    <button class="tb" onclick="showTab('java',this)">Java</button>
    <button class="tb" onclick="showTab('spring',this)">Spring</button>
    <button class="tb" onclick="showTab('sql',this)">SQL / DB</button>
    <button class="tb" onclick="showTab('sd',this)">System Design</button>
    <button class="tb" onclick="showTab('cloud',this)">Cloud</button>
    <button class="tb" onclick="showTab('budget',this)">Budget</button>
    <button class="tb" onclick="showTab('rules',this)">Daily Rules</button>
  </div>
</div>

<div id="panel-today"  class="panel active"></div>
<div id="panel-progress" class="panel"></div>
<div id="panel-weeks"  class="panel"></div>
<div id="panel-gfg"   class="panel"></div>
<div id="panel-java"  class="panel"></div>
<div id="panel-spring" class="panel"></div>
<div id="panel-sql"   class="panel"></div>
<div id="panel-sd"    class="panel"></div>
<div id="panel-cloud" class="panel"></div>
<div id="panel-budget" class="panel"></div>
<div id="panel-rules"  class="panel"></div>

</div>
<script src="ansh.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./service-worker.js')
      .catch(function(err){console.log('SW failed',err)});
  });
}
</script>
</body>
</html>

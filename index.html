<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackerApp</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackerApp">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100vh}
body{
  background:#0a0a0c;
  color:#e2e0dd;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:24px;
  position:relative;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(69,123,157,0.07) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(26,77,46,0.06) 0%, transparent 50%);
  pointer-events:none;
}
.container{
  text-align:center;
  max-width:560px;
  width:100%;
  position:relative;
  z-index:1;
}
.logo{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:#3d3b42;
  margin-bottom:44px;
}
h1{
  font-size:26px;
  font-weight:700;
  color:#e2e0dd;
  margin-bottom:6px;
  letter-spacing:-0.01em;
}
.tagline{
  font-size:13px;
  color:#4a4852;
  margin-bottom:40px;
  letter-spacing:0.01em;
}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.card{
  display:block;
  text-decoration:none;
  background:#141418;
  border:1px solid #252530;
  border-radius:10px;
  padding:26px 20px 20px;
  text-align:left;
  transition:transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  transition:opacity 0.18s;
}
.card.ansh::before{background:#457b9d}
.card.simran::before{background:#1A4D2E}
.card:hover{
  border-color:rgba(255,255,255,0.12);
  transform:translateY(-3px);
  background:#18181e;
}
.initial{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
  border:1px solid;
}
.card.ansh .initial{
  background:rgba(69,123,157,0.15);
  color:#6da3c0;
  border-color:rgba(69,123,157,0.3);
}
.card.simran .initial{
  background:rgba(26,77,46,0.2);
  color:#56aa78;
  border-color:rgba(26,77,46,0.4);
}
.person-name{
  font-size:20px;
  font-weight:700;
  color:#e2e0dd;
  margin-bottom:3px;
  letter-spacing:-0.01em;
}
.tracker-name{
  font-size:11px;
  font-weight:600;
  margin-bottom:14px;
  letter-spacing:0.05em;
  text-transform:uppercase;
}
.card.ansh .tracker-name{color:#6da3c0}
.card.simran .tracker-name{color:#56aa78}
.detail{
  font-size:12px;
  color:#4a4852;
  line-height:1.7;
}
.arrow{
  position:absolute;
  bottom:18px;
  right:18px;
  font-size:16px;
  color:#2c2a32;
  transition:color 0.18s, transform 0.18s;
}
.card:hover .arrow{
  color:#6b6875;
  transform:translateX(2px);
}
.footer{
  margin-top:32px;
  font-size:11px;
  color:#2a2830;
  letter-spacing:0.04em;
}
@media(max-width:420px){
  .cards{grid-template-columns:1fr}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">TrackerApp</div>
  <h1>Who's tracking today?</h1>
  <p class="tagline">Choose your tracker to continue</p>
  <div class="cards">
    <a href="ansh.html" class="card ansh">
      <div class="initial">A</div>
      <div class="person-name">Ansh</div>
      <div class="tracker-name">Java Interview Prep</div>
      <div class="detail">
        193 days · 1,158h budget<br>
        Walmart / PayPal / Swiggy<br>
        Starts May 21, 2026
      </div>
      <div class="arrow">→</div>
    </a>
    <a href="simran.html" class="card simran">
      <div class="initial">S</div>
      <div class="person-name">Simran</div>
      <div class="tracker-name">CPTE Tracker</div>
      <div class="detail">
        199 cases · 88 MCQ lecs<br>
        Aug 10 2026 exam<br>
        Sync via Google
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <div class="footer">TrackerApp · Built for focus</div>
</div>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./service-worker.js')
      .catch(function(err){console.log('SW failed',err)});
  });
}
</script>
</body>
</html>
